{% extends "layouts/base.html" %}
{% block title %}Add product — Morrow{% endblock %}
{% block body %}
<main class="container form-page-shell form-page-wide">
    <a class="back-link" href="{% url 'pl' %}">← Back to products</a>
    <section class="form-card"><span class="eyebrow">Grow your collection</span>
        <h1 class="section-title">Add a product.</h1>
        <p class="text-muted">Add the details shoppers need to discover something new.</p>
        <form method="post" class="mt-4" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="productTitle">Title</label>
                    <input id="productTitle" class="form-control" type="text" name="user_input_title" required>
                </div>
                <div class="col-sm-6 col-md-3">
                    <label class="form-label" for="productPrice">Price</label>
                    <input id="productPrice" class="form-control" type="number" name="user_input_price" required>
                </div>
                <div class="col-sm-6 col-md-3">
                    <label class="form-label" for="productQty">Quantity</label>
                    <input id="productQty" class="form-control" type="number" name="user_input_qty" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="productCategory">Category</label>
                    <select id="productCategory" class="form-select" name="user_input_category">
                        <option value="">Choose a category</option>
                        {% for i in category_data_key %}
                        <option value="{{i.id}}">{{i.name}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="productImage">Image</label>
                    <input id="productImage" class="form-control" type="file" name="user_input_img" accept="image/*">
                </div>
                <div class="col-12">
                    <label class="form-label" for="productDescription">Description</label>
                    <textarea id="productDescription" class="form-control" rows="5" name="user_input_des"></textarea>
                </div>
            </div>
            <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                <button class="btn btn-brand" type="submit">Create product</button>
                <a class="btn btn-light" href="{% url 'pl' %}">Cancel</a>
            </div>
        </form>
    </section>
</main>
{% endblock %}
