{% extends "layouts/base.html" %}
{% block title %}Page not found — Morrow{% endblock %}
{% block body %}
<main class="container error-shell">
    <div class="error-mark">404</div>
    <span class="eyebrow">A little off the map</span>
    <h1 class="section-title">This page wandered off.</h1>
    <p class="text-muted">The page you’re looking for may have moved, or it may not exist.</p><a
        class="btn btn-brand mt-2" href="{% url 'index' %}">Back to home <span aria-hidden="true">→</span></a>
</main>
{% endblock %}
