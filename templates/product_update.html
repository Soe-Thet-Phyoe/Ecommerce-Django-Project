{% extends "layouts/base.html" %}
{% block title %}Edit product — Morrow{% endblock %}
{% block body %}
<main class="container form-page-shell form-page-wide">
    <a class="back-link" href="{% url 'pl' %}">← Back to products</a>
    <section class="form-card"><span class="eyebrow">Grow your collection</span>
        <h1 class="section-title">Edit product.</h1>
        <p class="text-muted">Keep the details for this find up to date.</p>
        <form method="post" class="mt-4" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="productTitle">Title</label>
                    <input id="productTitle" class="form-control" type="text" name="user_input_title" value="{{item_key.title}}" required>
                </div>
                <div class="col-sm-6 col-md-3">
                    <label class="form-label" for="productPrice">Price</label>
                    <input id="productPrice" class="form-control" type="number" name="user_input_price"
                        value="{{item_key.price}}" required>
                    </div>
                <div class="col-sm-6 col-md-3">
                    <label class="form-label" for="productQty">Quantity</label>
                    <input id="productQty" class="form-control" type="number" name="user_input_qty"
                        value="{{item_key.qty}}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="productCategory">Category</label>
                    <select id="productCategory" class="form-select" name="user_input_category">
                        {% for i in category_data_key %}
                        <option value="{{i.id}}" {% if item_key.category.id == i.id %}selected{% endif %}>{{i.name}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="productImage">Replace image</label>
                    <input id="productImage" class="form-control" type="file" name="user_input_img" accept="image/*">
                    {% if item_key.image %}
                    <img src="{{item_key.image.url}}" class="current-product-image mt-3" alt="Current image of {{item_key.title}}">
                    {% endif %}
                </div>
                <div class="col-12">
                    <label class="form-label" for="productDescription">Description</label>
                    <textarea
                        id="productDescription" class="form-control" rows="5"
                        name="user_input_des">{{item_key.description}}</textarea>
                </div>
            </div>
            <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                <button class="btn btn-brand" type="submit">Save changes</button>
                    <a class="btn btn-light" href="{% url 'pl' %}">Cancel</a>
            </div>
        </form>
    </section>
</main>
{% endblock %}
